# Production stack for the shared VPS (see DEPLOY.md).
# No published ports: Caddy in /srv/proxy reaches "portfolio-web" over the "proxy" network.
name: portfolio

x-app: &app
  image: portfolio-app:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - ${STORAGE_PATH:-/srv/portfolio/storage}:/var/www/html/storage
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app

  web:
    image: portfolio-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    volumes:
      - ${STORAGE_PATH:-/srv/portfolio/storage}/app/public:/var/www/html/storage/app/public:ro
    networks:
      internal:
      proxy:
        aliases: [portfolio-web]
    depends_on: [app]

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=5", "--tries=3", "--max-time=3600"]

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:

networks:
  internal:
  proxy:
    external: true
