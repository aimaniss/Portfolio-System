<!doctype html>

                font-family: 'JetBrains Mono';
                font-weight: 400;
                src: local('x') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-weight: 500;
                src: local('x') format('woff2');
            }

                font-family: 'JetBrains Mono';
                font-weight: 700;

            }

            body {
                margin: 0;

                background: #1c1e22;

            a:hover {

            <div

                    gap: 12px;
                    height: 52px;
                    padding: 0 16px;
                    background: #2a2c31;
                    border-bottom: 1px solid #3a3d44;
                "
            >
                <div style="display: flex; gap: 6px">
                    <span
                        style="
                            width: 10px;
                            height: 10px;
                            border-radius: 50%;
                            background: #ff5f57;
                        "
                    ></span>
                    <span

                            width: 10px;
                            height: 10px;
                            border-radius: 50%;
                            background: #febc2e;
                        "

                    <span

                            height: 10px;

                        height: 44px;

                        align-items: center;
                        justify-content: center;
                        color: #b9bfc8;
                    "
                    ><svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"

                        <path d="M10 14 21 3"></path>
                        <path d="M21 14v7H3V3h7"></path></svg

                        border-bottom: 1px solid #2e3137;
                    "

                    <span style="color: #79c0ff">~/admin</span>

                        display: grid;
                        grid-template-columns: repeat(2, minmax(0, 1fr));

                            border: 1px solid #2e3137;
                            border-radius: 10px;
                            background: #202226;
                        "

                            background: #202226;
                        "

                            experiences

                                font-weight: 800;
                                color: #f0f2f5;

                                font-weight: 800;
                                color: #e3b341;

                            [n]

                        border: 1px solid #2e3137;
                        border-radius: 10px;
                        background: #202226;

                            color: #8b929c;

                    <a

                        style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            padding: 12px 14px;
                            border-bottom: 1px solid #2e3137;
                            color: #d6d9de;
