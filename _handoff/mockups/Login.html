<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Admin login</title>
    </head>
    <body>
        <style>
            @font-face {
                font-family: 'JetBrains Mono';
                font-weight: 400;
                src: local('x') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-weight: 500;
                src: local('x') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-weight: 700;
                src: local('x') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-weight: 800;
                src: local('x') format('woff2');
            }
            body {
                margin: 0;
                font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
                background: #101216;
                color: #d6d9de;
            }
            a {
                color: #79c0ff;
                text-decoration: none;
            }
            a:hover {
                color: #a5d6ff;
                text-decoration: underline;
            }
            @keyframes blink {
                0%,
                49% {
                    opacity: 1;
                }
                50%,
                100% {
                    opacity: 0;
                }
            }
            .cur {
                animation: blink 1.1s steps(1) infinite;
            }
        </style>

        <div
            style="
                width: 880px;
                height: 560px;
                box-sizing: border-box;
                padding: 60px 110px;
                background: #101216;
                font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
                color: #d6d9de;
            "
        >
            <div
                style="
                    display: flex;
                    flex-direction: column;
                    height: 100%;
                    background: #1c1e22;
                    border: 1px solid #3a3d44;
                    border-radius: 12px;
                    overflow: hidden;
                    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
                "
            >
                <div
                    style="
                        display: flex;
                        align-items: center;
                        gap: 16px;
                        height: 40px;
                        padding: 0 14px;
                        background: #2a2c31;
                        border-bottom: 1px solid #3a3d44;
                    "
                >
                    <div style="display: flex; gap: 8px">
                        <span
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #ff5f57;
                            "
                        ></span>
                        <span
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #febc2e;
                            "
                        ></span>
                        <span
                            style="
                                width: 12px;
                                height: 12px;
                                border-radius: 50%;
                                background: #28c840;
                            "
                        ></span>
                    </div>
                    <div
                        style="
                            flex-grow: 1;
                            text-align: center;
                            font-size: 12px;
                            color: #a3aab4;
                        "
                    >
                        ssh admin@portfolio
                    </div>
                    <div style="width: 52px"></div>
                </div>
                <form
                    style="
                        flex-grow: 1;
                        display: flex;
                        flex-direction: column;
                        gap: 16px;
                        padding: 32px 36px;
                        font-size: 14px;
                        line-height: 1.6;
                    "
                >
                    <div>
                        <span style="color: #7ee787">guest@portfolio</span>
                        <span style="color: #8b929c">%</span> sudo login --admin
                    </div>
                    <div style="font-size: 13px; color: #8b929c">
                        Authorized personnel only. Registration is disabled.
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px">
                        <label
                            for="l-email"
                            style="width: 100px; color: #e3b341"
                            >email:</label
                        ><input
                            id="l-email"
                            type="email"
                            placeholder="admin@domain.com"
                            style="
                                flex-grow: 1;
                                padding: 10px 12px;
                                background: #15171b;
                                border: 1px solid #3a3d44;
                                border-radius: 6px;
                                color: #f0f2f5;
                                font: inherit;
                            "
                        />
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px">
                        <label for="l-pass" style="width: 100px; color: #e3b341"
                            >password:</label
                        ><input
                            id="l-pass"
                            type="password"
                            placeholder="••••••••"
                            style="
                                flex-grow: 1;
                                padding: 10px 12px;
                                background: #15171b;
                                border: 1px solid #3a3d44;
                                border-radius: 6px;
                                color: #f0f2f5;
                                font: inherit;
                            "
                        />
                    </div>
                    <div
                        style="
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            padding-left: 112px;
                        "
                    >
                        <input
                            id="l-rem"
                            type="checkbox"
                            style="accent-color: #7ee787"
                        /><label
                            for="l-rem"
                            style="color: #b9bfc8; font-size: 13px"
                            >remember this session</label
                        >
                    </div>
                    <div style="display: flex; gap: 12px; padding-left: 112px">
                        <a
                            href="Admin.dc.html"
                            style="
                                padding: 10px 20px;
                                background: #7ee787;
                                color: #101216;
                                border-radius: 6px;
                                font-weight: 700;
                            "
                            >login ↵</a
                        >
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
